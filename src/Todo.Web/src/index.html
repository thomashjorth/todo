<!doctype html>
<!-- color-scheme hører på RODEN, ikke på <body>, og det er målt frem for stilistisk: på <body>
     styler den kroppen og alt under den, mens roden bliver stående på `normal`. Browseren maler
     <select>-popup'en, rullebjælkerne og lærredet efter rodens skema, så statusvælgeren åbnede hvid
     under en mørk app — med optionernes tekst stadig i det mørke temas lysegrå, altså næsten
     usynlig. Målt 2026-08-27 med præferencen på mørk og klassen på <body>: systemfarven Canvas gav
     rgb(255,255,255) på roden og rgb(18,18,18) under <body> — et lyst dokument med en mørk krop.
     To eksplicitte klasser frem for den ene kombinerede `light dark`-værdi, og det er også målt:
     med den kombinerede værdi på roden var det BRUGTE skema allerede mørkt (Canvas gav
     rgb(18,18,18) på roden), og popup'en var STADIG hvid i Photino-vinduet — verificeret ved at
     hente index.html fra den kørende app, så det ikke var en udeployet rettelse. Popup'en følger
     altså ikke det resolverede skema, og det eksplicitte nøgleord er den ene ting tilbage der kan
     gøre en forskel i WebView2. Begge retninger skrives ud, fordi appen ingen tema-kontakt har:
     `dark:` er `prefers-color-scheme`, og lys skal blive ved at være lys.
     Vagten er ColorSchemeTests, som måler rodens brugte skema i begge temaer. Den kan IKKE se
     popup'en: den er browserens eget vindue og kommer ikke med i et screenshot. -->
<html lang="en" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="utf-8" />
    <title>Mandalorian ToDo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <app-root></app-root>
  </body>
</html>
