<!doctype html>
<!-- color-scheme belongs on the ROOT, not on <body>, and that is measured rather than stylistic:
     on <body> it styles the body and everything under it, while the root stays at `normal`. The
     browser paints the <select> popup, the scrollbars and the canvas from the root's scheme, so the
     status picker opened white under a dark app — with the options' text still in the dark theme's
     light grey, that is to say almost invisible. Measured 2026-08-27 with the preference on dark
     and the class on <body>: the system colour Canvas gave rgb(255,255,255) on the root and
     rgb(18,18,18) under <body> — a light document with a dark body inside it.
     Two explicit classes rather than the one combined `light dark` value, and that is measured too:
     with the combined value on the root the USED scheme was already dark (Canvas gave
     rgb(18,18,18) on the root), and the popup was STILL white in the Photino window — verified by
     fetching index.html from the running app, so it was not an undeployed fix. The popup therefore
     does not follow the resolved scheme, and the explicit keyword is the one thing left that can
     make a difference in WebView2. Both directions are written out, because the app has no theme
     switch: `dark:` is `prefers-color-scheme`, and light has to go on being light.
     The guard is ColorSchemeTests, which measures the root's used scheme in both themes. It can NOT
     see the popup: that is the browser's own window and does not come along in a screenshot. -->
<html lang="en" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="utf-8" />
    <title>Mandalorian ToDo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <app-root></app-root>
  </body>
</html>
