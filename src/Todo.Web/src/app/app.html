<main class="mx-auto max-w-2xl p-4 sm:p-8">
  <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Todo</h1>
  <app-task-list />
  @if (status(); as s) {
    <p data-testid="health" class="mt-8 text-xs text-gray-400">
      API: {{ s.status }} (v{{ s.version }})
    </p>
  } @else if (failed()) {
    <p data-testid="health" class="mt-8 text-xs text-red-600">API: unavailable</p>
  }
</main>
