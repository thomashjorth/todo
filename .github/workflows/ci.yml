name: CI

# Personligt repo uden fast PR-flow: kør på hvert push, så en gren der aldrig bliver
# til en PR også bliver målt. workflow_dispatch er til at gentage en kørsel i hånden.
on:
  push:
  pull_request:
  workflow_dispatch:

# En ny commit på samme gren afløser den forrige kørsel frem for at stå i kø bag den.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows er ikke et valg: FrontendStrictnessTests kalder node_modules\.bin\tsc.cmd.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      # global.json pinner 10.0.300 med rollForward latestFeature.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # ^22.22.3 kræves af @angular/core 22.1; 22.x er også det udviklingsmaskinen kører.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Todo.Web/package-lock.json

      - name: Installér npm-afhængigheder
        working-directory: src/Todo.Web
        run: npm ci

      # BrowserFixture henter selv Chromium ved opstart. Cachen sparer downloaden;
      # nøglen er csproj'en, fordi det er den der pinner Microsoft.Playwright-versionen.
      - name: Genbrug Playwrights browsere
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Todo.E2E/Todo.E2E.csproj') }}

      # Skal ligge før dotnet test: TodoApp.OpenAsync fejler hvis wwwroot\index.html
      # mangler, så uden det her falder hele E2E-suiten af den forkerte grund.
      - name: Byg Angular ind i wwwroot
        working-directory: src/Todo.Web
        run: npm run build

      # Samme kommando som CLAUDE.md dokumenterer lokalt — samme konfiguration, så en
      # grøn maskine og en grøn kørsel betyder det samme. Kører alle fire testprojekter,
      # inklusive drift-, friskheds-, kontrast- og migreringsvagterne.
      - name: dotnet test
        run: dotnet test Todo.sln --logger trx --results-directory TestResults

      # Hver fejlet test som en annotation. Loggen kræver login hos GitHub, men annotationer kan
      # læses af API'et uden — og CI fejlede i dotnet test fra september til oktober 2026, uden at
      # nogen uden for et login kunne se hvorfor.
      - name: Fejlede tests som annotationer
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            Select-Xml -Xml $trx -Namespace $ns -XPath "//t:UnitTestResult[@outcome='Failed']" | Select-Object -First 30 | ForEach-Object {
              $name = $_.Node.testName
              $message = ($_.Node.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Output "::error title=$name::$message"
            }
          }

      - name: Vitest
        working-directory: src/Todo.Web
        run: npm run test -- --watch=false

  # Imaget NAS'en kører. Kun på main og kun efter grønne tests: NAS'en henter :latest hvert
  # femte minut, så det der skubbes her, er det der kører derhjemme kort efter.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Byg imaget
        run: docker build -t todo:probe .

      # Før skubbet: et image der ikke svarer udefra, ikke logger ind, kører som root,
      # siger UTC eller lægger data uden for /data, når aldrig NAS'en.
      - name: Prøv imaget
        run: bash scripts/probe-image.sh todo:probe

      - name: Log ind på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # :latest er det NAS'en henter; :<sha> er det man ruller tilbage til. Sha'et først: en
      # nyere commit afbryder kørslen (cancel-in-progress), og et :latest uden sit sha ville
      # ikke kunne rulles tilbage til.
      - name: Skub imaget
        run: |
          for tag in "${GITHUB_SHA}" latest; do
            docker tag todo:probe "ghcr.io/thomashjorth/todo:${tag}"
            docker push "ghcr.io/thomashjorth/todo:${tag}"
          done
