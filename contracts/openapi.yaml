openapi: 3.0.4
info:
  title: Todo API
  version: 1.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Reports that the API is running.
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/tasks:
    get:
      operationId: listTasks
      tags:
        - Tasks
      parameters:
        - name: includeCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeSomeday
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The tasks, ordered by deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTaskListResponse'
    post:
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoTaskRequest'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tasks/{id}:
    put:
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
    delete:
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The task is gone.
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks:
    post:
      operationId: createSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubTaskRequest'
      responses:
        '201':
          description: The created subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks/{subTaskId}:
    put:
      operationId: updateSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subTaskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubTaskRequest'
      responses:
        '200':
          description: The updated subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such task or subtask.
    delete:
      operationId: deleteSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subTaskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The subtask is gone.
        '404':
          description: No such task or subtask.
  /api/retro/preview:
    post:
      operationId: previewRetro
      tags:
        - Retro
      summary: Reads a retro board export without storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroPreviewRequest'
      responses:
        '200':
          description: The rows the export contains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroPreviewResponse'
        '400':
          description: The export could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/retro/import:
    post:
      operationId: importRetro
      tags:
        - Retro
      summary: Creates a task for every row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroImportResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/retro/aliases:
    get:
      operationId: listRetroAliases
      tags:
        - Retro
      responses:
        '200':
          description: The names counted as the user's own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
    put:
      operationId: replaceRetroAliases
      tags:
        - Retro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroAliasesRequest'
      responses:
        '200':
          description: The stored names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/settings:
    get:
      operationId: getSettings
      tags:
        - Settings
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      operationId: updateSettings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsRequest'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/settings/jira-token:
    put:
      operationId: setJiraToken
      tags:
        - Settings
      summary: Stores the Jira personal access token the import authenticates with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraTokenRequest'
      responses:
        '200':
          description: The token was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: The token was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: clearJiraToken
      tags:
        - Settings
      summary: Forgets the stored Jira token.
      responses:
        '200':
          description: The token was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
  /api/jira/test:
    post:
      operationId: testJiraConnection
      tags:
        - Jira
      summary: Asks Jira who the stored token belongs to.
      description: >-
        A POST rather than a GET because this is an action the user asks for and expects to
        re-run, not a resource to read; a GET may be served from a cache and answer without
        having contacted Jira at all. /api/jira/statuses stays a GET because a list of status
        names is exactly a cacheable resource.
      responses:
        '200':
          description: The name Jira reports for the token's owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnectionResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/statuses:
    get:
      operationId: listJiraStatuses
      tags:
        - Jira
      summary: Lists the status names the configured project uses.
      responses:
        '200':
          description: The status names, so the waiting list can be picked rather than typed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraStatusesResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/preview:
    post:
      operationId: previewJira
      tags:
        - Jira
      summary: Reads the user's assigned issues without storing anything.
      responses:
        '200':
          description: The rows the import would create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraPreviewResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/import:
    post:
      operationId: importJira
      tags:
        - Jira
      summary: Creates a task for every Jira row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraImportResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/system/open-link:
    post:
      operationId: openLink
      tags:
        - System
      summary: Hands a link to the system browser, which the app window cannot show itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLinkRequest'
      responses:
        '204':
          description: The link was handed to the system browser.
        '400':
          description: The link is not one the app may open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0.0
    TodoStatus:
      type: string
      enum: [open, inProgress, waitingFor, someday, done]
    DeadlineBucket:
      type: string
      enum: [overdue, today, thisWeek, later, noDeadline, deferred]
    TodoSubTask:
      type: object
      additionalProperties: false
      required: [id, title, isDone]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        isDone: { type: boolean }
    TodoTask:
      type: object
      additionalProperties: false
      required: [id, sourceId, title, status, bucket, createdAt, subTasks]
      properties:
        id: { type: integer, format: int64 }
        sourceId: { type: string }
        title: { type: string }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
        externalUrl:
          type: string
          nullable: true
          description: >-
            Where the source system shows this item. Computed from the source and the
            external key, never stored, so it follows a changed base URL.
        status: { $ref: '#/components/schemas/TodoStatus' }
        bucket: { $ref: '#/components/schemas/DeadlineBucket' }
        waitingOn: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time, nullable: true }
        waitingDays: { type: integer, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        subTasks:
          type: array
          items:
            $ref: '#/components/schemas/TodoSubTask'
    TodoTaskListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoTask'
    CreateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
    UpdateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        waitingOn: { type: string, nullable: true }
    CreateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
    UpdateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title, isDone]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        isDone: { type: boolean }
    RetroPreviewRequest:
      type: object
      additionalProperties: false
      required: [csv]
      properties:
        csv: { type: string }
    RetroPreviewRow:
      type: object
      additionalProperties: false
      required: [key, title, zone, isMine, alreadyImported]
      properties:
        key: { type: string }
        title: { type: string }
        owner: { type: string, nullable: true }
        author: { type: string, nullable: true }
        zone: { type: string }
        deadline: { type: string, format: date, nullable: true }
        isMine: { type: boolean }
        alreadyImported: { type: boolean }
    RetroPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, skippedRatingCards]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroPreviewRow'
        skippedRatingCards: { type: integer }
    RetroImportRow:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        requester: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
    RetroImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroImportRow'
    RetroImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    RetroAliasesRequest:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
    RetroAliasesResponse:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
    JiraConnectionResponse:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
    JiraStatusesResponse:
      type: object
      additionalProperties: false
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    JiraPreviewRow:
      type: object
      additionalProperties: false
      required: [key, title, url, status, isWaiting, isDuty, alreadyImported]
      properties:
        key:
          type: string
        title:
          type: string
        url:
          type: string
          description: >-
            Where Jira shows this issue. Computed from the configured base URL and the key, never
            stored, so it follows a changed base URL. Always present: a preview cannot happen without
            a configured base URL, so this is required rather than nullable — a nullable field would
            add an @if branch, and a branch is unmeasured until a fixture renders it.
        note:
          type: string
          nullable: true
          description: The Jira description, converted from wiki markup to CommonMark.
        deadline:
          type: string
          format: date
          nullable: true
        requester:
          type: string
          nullable: true
        status:
          type: string
          description: The Jira status name, shown so the user can see why a row is waiting.
        isWaiting:
          type: boolean
          description: Whether the status is in the user's waiting list.
        isDuty:
          type: boolean
          description: >-
            Whether this issue came from the duty pool rather than being assigned to the user. The
            screen labels it, so a pool issue is not mistaken for one of your own.
        waitingSince:
          type: string
          format: date-time
          nullable: true
        alreadyImported:
          type: boolean
        excluded:
          type: string
          nullable: true
          example: jira.excludedWaiting
          description: >-
            Why import will skip this row, as an error code the frontend translates.
            Null means it will be imported.
    JiraPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/JiraPreviewRow'
        total:
          type: integer
          format: int32
          description: What Jira reported as the total, so a truncated page is visible.
    JiraImportRow:
      type: object
      additionalProperties: false
      required: [key, title, status]
      properties:
        key:
          type: string
        title:
          type: string
        note:
          type: string
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        requester:
          type: string
          nullable: true
        status:
          type: string
          description: >-
            The Jira status name. The server decides whether that means waiting, by looking it
            up in the user's waiting list — the client must not send that decision, because the
            setting lives on the server and a required boolean cannot be enforced on the wire.
        waitingSince:
          type: string
          format: date-time
          nullable: true
    JiraImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/JiraImportRow'
    JiraImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped]
      properties:
        imported:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    SettingsRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          nullable: true
          example: da
        jiraBaseUrl:
          type: string
          nullable: true
        jiraProjectKey:
          type: string
          nullable: true
        jiraWaitingStatuses:
          type: array
          items:
            type: string
        jiraIncludeWaiting:
          type: boolean
        jiraDutyStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean "waiting for the shared duty pool". Issues in these are fetched
            regardless of assignee when jiraOnDuty is on, and they arrive actionable rather than
            waiting.
        jiraOnDuty:
          type: boolean
          description: >-
            Whether the user currently holds the 2nd level support duty. Off by default. Separate
            from the list so the list survives going off duty.
    SettingsResponse:
      type: object
      additionalProperties: false
      required: [jiraWaitingStatuses, jiraIncludeWaiting, jiraDutyStatuses, jiraOnDuty, hasJiraToken]
      properties:
        language:
          type: string
          nullable: true
          example: da
        jiraBaseUrl:
          type: string
          nullable: true
        jiraProjectKey:
          type: string
          nullable: true
        jiraWaitingStatuses:
          type: array
          items:
            type: string
        jiraIncludeWaiting:
          type: boolean
        jiraDutyStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean "waiting for the shared duty pool". Issues in these are fetched
            regardless of assignee when jiraOnDuty is on, and they arrive actionable rather than
            waiting.
        jiraOnDuty:
          type: boolean
          description: >-
            Whether the user currently holds the 2nd level support duty. Off by default. Separate
            from the list so the list survives going off duty.
        hasJiraToken:
          type: boolean
          description: >-
            Whether a token is stored. The token itself is never returned; it is written
            through PUT /api/settings/jira-token and cleared through DELETE.
    JiraTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    OpenLinkRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          example: https://example.com/docs
