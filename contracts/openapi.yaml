openapi: 3.0.4
info:
  title: Todo API
  version: 1.0.0
  description: >-
    Every operation answers 401 without the login cookie, except getHealth and login. The 401 is not
    written on each operation: it is the same for all of them and carries no body.
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Reports that the API is running.
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Checks the app's one password and sets the cookie that keeps the browser logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in; the cookie is set.
        '400':
          description: The password is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many attempts in a minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tasks:
    get:
      operationId: listTasks
      tags:
        - Tasks
      parameters:
        - name: includeCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeSomeday
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The tasks, ordered by deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTaskListResponse'
    post:
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoTaskRequest'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tasks/{id}:
    put:
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
    delete:
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The task is gone.
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks:
    post:
      operationId: createSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubTaskRequest'
      responses:
        '201':
          description: The created subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks/{subTaskId}:
    put:
      operationId: updateSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subTaskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubTaskRequest'
      responses:
        '200':
          description: The updated subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such task or subtask.
    delete:
      operationId: deleteSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subTaskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The subtask is gone.
        '404':
          description: No such task or subtask.
  /api/review:
    get:
      operationId: getReviewStatus
      tags:
        - Review
      summary: Whether the weekly review is owed, and when the next one is due.
      description: >-
        Carries only the due state. The five groups the review screen walks through are grouped in
        the client off the bucket each task already carries, because TaskRow and TaskDetail inject
        TaskStore directly — a review holding its own copy of the list would go stale the moment
        anything was saved, and the row would not leave its group.
      responses:
        '200':
          description: The review's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
  /api/review/complete:
    post:
      operationId: completeReview
      tags:
        - Review
      summary: Records that the weekly review has been finished.
      description: >-
        Stamps the clock and answers the new state, so the client needs no second call. A route of
        its own rather than a field on PUT /api/settings, for the same reason each token has one:
        that route is a full replacement and reads an absent field as clear, so an unrelated save
        would wipe the timestamp. Idempotent in effect — finishing twice simply moves the stamp.
      responses:
        '200':
          description: The review's state after the stamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
  /api/retro/preview:
    post:
      operationId: previewRetro
      tags:
        - Retro
      summary: Reads a retro board export without storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroPreviewRequest'
      responses:
        '200':
          description: The rows the export contains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroPreviewResponse'
        '400':
          description: The export could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/retro/import:
    post:
      operationId: importRetro
      tags:
        - Retro
      summary: Creates a task for every row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroImportResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/retro/aliases:
    get:
      operationId: listRetroAliases
      tags:
        - Retro
      responses:
        '200':
          description: The names counted as the user's own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
    put:
      operationId: replaceRetroAliases
      tags:
        - Retro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroAliasesRequest'
      responses:
        '200':
          description: The stored names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/settings:
    get:
      operationId: getSettings
      tags:
        - Settings
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      operationId: updateSettings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsRequest'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/settings/jira-token:
    put:
      operationId: setJiraToken
      tags:
        - Settings
      summary: Stores the Jira personal access token the import authenticates with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraTokenRequest'
      responses:
        '200':
          description: The token was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: The token was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: clearJiraToken
      tags:
        - Settings
      summary: Forgets the stored Jira token.
      responses:
        '200':
          description: The token was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
  /api/settings/ado-token:
    put:
      operationId: setAdoToken
      tags:
        - Settings
      summary: Stores the Azure DevOps personal access token the import authenticates with.
      description: >-
        A route of its own rather than a field on PUT /api/settings, because that is a full
        replacement which reads an absent field as "clear": a client saving anything else on
        the settings page would wipe the token, and the token can never be sent back to the
        client to be echoed. SettingsResponse carries only hasAdoToken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoTokenRequest'
      responses:
        '200':
          description: The token was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: The token was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: clearAdoToken
      tags:
        - Settings
      summary: Forgets the stored Azure DevOps token.
      responses:
        '200':
          description: The token was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
  /api/jira/test:
    post:
      operationId: testJiraConnection
      tags:
        - Jira
      summary: Asks Jira who the stored token belongs to.
      description: >-
        A POST rather than a GET because this is an action the user asks for and expects to
        re-run, not a resource to read; a GET may be served from a cache and answer without
        having contacted Jira at all. /api/jira/statuses stays a GET because a list of status
        names is exactly a cacheable resource.
      responses:
        '200':
          description: The name Jira reports for the token's owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnectionResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/statuses:
    get:
      operationId: listJiraStatuses
      tags:
        - Jira
      summary: Lists the status names the configured project uses.
      responses:
        '200':
          description: The status names, so the waiting list can be picked rather than typed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraStatusesResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/preview:
    post:
      operationId: previewJira
      tags:
        - Jira
      summary: Reads the user's assigned issues without storing anything.
      responses:
        '200':
          description: The rows the import would create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraPreviewResponse'
        '400':
          description: Jira could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/jira/import:
    post:
      operationId: importJira
      tags:
        - Jira
      summary: Creates a task for every Jira row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraImportResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ado/test:
    post:
      operationId: testAdoConnection
      tags:
        - Ado
      summary: Asks Azure DevOps who the stored token belongs to.
      description: >-
        A POST rather than a GET because this is an action the user asks for and expects to
        re-run, not a resource to read. The distinction is action against resource, not
        whether the call reaches the network: /api/ado/states is a GET even though it too
        contacts the server, because a list of state names is exactly a cacheable resource.
      responses:
        '200':
          description: The name Azure DevOps reports for the token's owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoConnectionResponse'
        '400':
          description: Azure DevOps could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ado/states:
    get:
      operationId: listAdoStates
      tags:
        - Ado
      summary: Lists the state names the configured project uses.
      description: >-
        A GET because a list of names is a resource rather than an action, and may be served
        from a cache. State names differ per work item type — Test Suite uses In Progress
        where Bug and User Story use Active — so the waiting list is picked rather than typed.
      responses:
        '200':
          description: The state names, so the waiting list can be picked rather than typed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoStatesResponse'
        '400':
          description: Azure DevOps could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ado/preview:
    post:
      operationId: previewAdo
      tags:
        - Ado
      summary: Reads the user's assigned work items without storing anything.
      description: >-
        A POST for the same reason as /api/ado/test: previewing is an action the user asks
        for and expects to repeat, not a cacheable resource.
      responses:
        '200':
          description: The rows the import would create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoPreviewResponse'
        '400':
          description: Azure DevOps could not be reached, or the token was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ado/import:
    post:
      operationId: importAdo
      tags:
        - Ado
      summary: Creates a task for every Azure DevOps row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoImportResponse'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ai/status:
    get:
      operationId: getAiStatus
      tags:
        - Ai
      summary: Reports whether the local AI model can be asked right now.
      description: >-
        Never an error. An Ollama that is not running, does not have the configured model or does
        not answer within three seconds is reported as not ready, and the app hides its AI features.
      responses:
        '200':
          description: Whether the model is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusResponse'
  /api/ai/retro-actions:
    post:
      operationId: suggestRetroActions
      tags:
        - Ai
      summary: Suggests an action title, and an owner where the board names none, for each retro note. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRetroActionsRequest'
      responses:
        '200':
          description: One suggestion per note the model answered for; a note it skipped has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRetroActionsResponse'
        '400':
          description: There are no notes, or the model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ai/search:
    post:
      operationId: searchByMeaning
      tags:
        - Ai
      summary: Finds the tasks closest in meaning to the query, done ones included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchRequest'
      responses:
        '200':
          description: >-
            At most three, best first, each with what the screen needs to show it - so a done task
            can be shown without being loaded into the list. Empty when nothing is close enough.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchResponse'
        '400':
          description: The query is blank, or the embedding model could not be asked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ai/duplicates:
    post:
      operationId: findDuplicates
      tags:
        - Ai
      summary: Finds the tasks from other sources that import rows resemble. A warning, never a block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiDuplicatesRequest'
      responses:
        '200':
          description: The closest task per row that resembles one; rows without a match are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDuplicatesResponse'
        '400':
          description: The embedding model could not be asked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ai/review-overview:
    post:
      operationId: writeReviewOverview
      tags:
        - Ai
      summary: Writes three to five points for the weekly review from facts the host gathers itself.
      responses:
        '200':
          description: The points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewOverview'
        '400':
          description: The model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tags:
    get:
      operationId: listTags
      tags:
        - Tags
      summary: The tags the user has defined, by name.
      responses:
        '200':
          description: Every tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
    post:
      operationId: createTag
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: The created tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRef'
        '400':
          description: The name is blank, too long, or taken whatever its case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tags/{id}:
    put:
      operationId: updateTag
      tags:
        - Tags
      summary: Renames a tag and sets its colour.
      description: >-
        Both fields are required: a tag has no other, so the full replacement costs nothing. A name
        another tag has, case aside, is refused; the tag's own name in another case is not.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: The tag as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRef'
        '400':
          description: >-
            tags.nameRequired, tags.nameTooLong, tags.duplicate or tags.colorInvalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No tag with that id.
    delete:
      operationId: deleteTag
      tags:
        - Tags
      summary: Deletes a tag and takes it off every task that carried it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The tag is gone.
        '404':
          description: No tag with that id.
  /api/tasks/{id}/tags:
    put:
      operationId: setTaskTags
      tags:
        - Tags
      summary: Replaces a task's tags with the given ones.
      description: >-
        Its own route rather than a field on UpdateTodoTaskRequest, which is a full replacement that
        reads an absent field as "clear": every save of a title would otherwise have to carry the tags.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaskTagsRequest'
      responses:
        '204':
          description: The task carries exactly the given tags.
        '400':
          description: A tag id that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
  /api/ai/tasks/{id}/tag-suggestions:
    post:
      operationId: suggestTags
      tags:
        - Ai
      summary: Suggests none or more of the user's own tags for a task. Nothing is saved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The suggested tag ids, never one the task already carries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTagSuggestions'
        '400':
          description: The model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
  /api/ai/warm:
    post:
      operationId: warmAi
      tags:
        - Ai
      summary: Loads the local model so the first suggestion does not wait for it.
      description: >-
        Never an error. Asked once by the app at startup when the model is ready; on the user's CPU
        the load is most of a cold call's fifteen seconds.
      responses:
        '204':
          description: The model is loaded, or could not be and the features stay as they were.
  /api/ai/parse-task:
    post:
      operationId: parseTask
      tags:
        - Ai
      summary: Suggests a task from one line of free text. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiParseTaskRequest'
      responses:
        '200':
          description: The suggested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskSuggestion'
        '400':
          description: The text is blank, or the model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ai/tasks/{id}/split:
    post:
      operationId: suggestSubTasks
      tags:
        - Ai
      summary: Suggests subtasks for a task from its title, note and existing subtasks. Nothing is saved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The suggested subtask titles, at most six.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSubTaskSuggestions'
        '400':
          description: The model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
  /api/ai/tasks/{id}/summary:
    post:
      operationId: summarizeNote
      tags:
        - Ai
      summary: Suggests a summary of a task's note in at most two sentences. Nothing is saved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The suggested summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoteSummary'
        '400':
          description: The note is empty, or the model could not be asked or could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with that id.
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0.0
    TodoStatus:
      type: string
      enum: [open, inProgress, waitingFor, someday, done]
    DeadlineBucket:
      type: string
      enum: [overdue, today, thisWeek, later, noDeadline, deferred]
    TodoSubTask:
      type: object
      additionalProperties: false
      required: [id, title, isDone]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        isDone: { type: boolean }
    TodoTask:
      type: object
      additionalProperties: false
      required: [id, sourceId, title, status, bucket, createdAt, subTasks]
      properties:
        id: { type: integer, format: int64 }
        sourceId: { type: string }
        title: { type: string }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
        externalUrl:
          type: string
          nullable: true
          description: >-
            Where the source system shows this item. Computed from the source and the
            external key, never stored, so it follows a changed base URL.
        status: { $ref: '#/components/schemas/TodoStatus' }
        bucket: { $ref: '#/components/schemas/DeadlineBucket' }
        waitingOn: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time, nullable: true }
        waitingDays: { type: integer, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        subTasks:
          type: array
          items:
            $ref: '#/components/schemas/TodoSubTask'
        tags:
          type: array
          description: >-
            The task's tags by name. Always sent, but optional on the contract so a fixture written
            before tags existed does not have to learn them; a missing list means none.
          items:
            $ref: '#/components/schemas/TagRef'
    TodoTaskListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoTask'
    CreateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
    UpdateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        deferUntil:
          type: string
          format: date
          nullable: true
          description: >-
            The date the task becomes actionable. Before it the task is deferred and
            stays out of the deadline sections; it returns to the list on its own when
            the date arrives.
        requester: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        waitingOn: { type: string, nullable: true }
    CreateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
    UpdateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title, isDone]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        isDone: { type: boolean }
    RetroPreviewRequest:
      type: object
      additionalProperties: false
      required: [csv]
      properties:
        csv: { type: string }
    RetroPreviewRow:
      type: object
      additionalProperties: false
      required: [key, title, zone, isMine, alreadyImported]
      properties:
        key: { type: string }
        title: { type: string }
        owner: { type: string, nullable: true }
        author: { type: string, nullable: true }
        zone: { type: string }
        deadline: { type: string, format: date, nullable: true }
        isMine: { type: boolean }
        alreadyImported: { type: boolean }
    RetroPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, skippedRatingCards]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroPreviewRow'
        skippedRatingCards: { type: integer }
    RetroImportRow:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        requester: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
    RetroImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroImportRow'
    RetroImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    RetroAliasesRequest:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
    RetroAliasesResponse:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
    JiraConnectionResponse:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
    JiraStatusesResponse:
      type: object
      additionalProperties: false
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    ClosureReason:
      type: string
      enum: [resolved, unassigned]
      description: >-
        Why reconciliation offers to close a local task. Shared by both sources rather than duplicated
        per source, because neither value names anything Jira or Azure DevOps specific: they describe
        what reconciliation found, and two copies would be two things to keep in step with nothing
        able to see them drift apart.

        The reason travels on the closure row as well as the preview row, and that is not a
        convenience. The import re-takes the decision by looking the state up in the user's done
        list, and being handed to somebody else is orthogonal to being finished - so an unassigned
        closure's state need not stand in that list at all, and without the reason every one of them
        would be skipped and counted as skipped.

        The price is that the server's re-decision is weaker for unassigned than for resolved, and
        that is a cost rather than an oversight. Ownership is a fact only the source can settle, and
        the import deliberately makes no call to Jira or Azure DevOps, so there is nothing here to
        check it against - the state, which is what the server can check, is exactly the thing an
        unassigned closure says nothing with. What is left is what the server can still require: that
        the task exists, that it belongs to this source, and that it is not already done. The same
        shape doneAt and waitingSince already have, and worth stating so nobody reads the shorter
        guard as a missing one.
    ReopenTarget:
      type: string
      enum: [open, waitingFor]
      description: >-
        Which status a reopening would put the task back into - the same mapping the import loop
        already uses for a fresh row, so the suggestion and the import cannot drift apart. Shared by
        both sources for the same reason ClosureReason is.
    JiraPreviewRow:
      type: object
      additionalProperties: false
      required:
        [key, title, url, isWaiting, isDuty, alreadyImported, suggestsClosing, suggestsReopening,
         reconciled]
      properties:
        key:
          type: string
        title:
          type: string
        url:
          type: string
          description: >-
            Where Jira shows this issue. Computed from the configured base URL and the key, never
            stored, so it follows a changed base URL. Always present: a preview cannot happen without
            a configured base URL, so this is required rather than nullable — a nullable field would
            add an @if branch, and a branch is unmeasured until a fixture renders it.
        note:
          type: string
          nullable: true
          description: The Jira description, converted from wiki markup to CommonMark.
        deadline:
          type: string
          format: date
          nullable: true
        requester:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: >-
            The Jira status name, shown so the user can see why a row is waiting. Nullable because a
            reconciled key the source does not know has no status - no answer came back to take one
            from. Forcing an empty string would be the worse of the two forms: a field whose type
            says "always there" while its value says otherwise. The row explains the absence itself,
            through its excluded code.
        isWaiting:
          type: boolean
          description: Whether the status is in the user's waiting list.
        isDuty:
          type: boolean
          description: >-
            Whether this issue came from the duty pool rather than being assigned to the user. The
            screen labels it, so a pool issue is not mistaken for one of your own.
        waitingSince:
          type: string
          format: date-time
          nullable: true
        alreadyImported:
          type: boolean
        suggestsClosing:
          type: boolean
          description: >-
            Whether import should offer to close the local task, because all three of these hold: the
            key has been imported before, the status is in the user's done list, and the local task is
            not done yet. The server's decision rather than three facts for the client to combine —
            the lists live on the server, and the import takes the decision again.
        closureReason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClosureReason'
          description: >-
            Which of the two findings the closing suggestion rests on, so the screen can say "resolved
            in Jira" and "handed to somebody else" in two sentences rather than one that covers
            neither. Null when suggestsClosing is false — the reason exists only where there is a
            suggestion to explain. See ClosureReason for what an unassigned reason costs the server's
            re-decision on the way back in, which is the half of this field a reader of the import
            needs.
        doneAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the issue reached its current status, for a row that suggests closing. Its own field
            rather than a loosened waitingSince, which means something else: a field that changes
            meaning with another boolean is one a later reader misreads. Nullable because Jira's
            changelog may hold no such entry, and null as well for an unassigned closure: the issue
            was never finished, it stopped being yours, so the completion time falls back to the
            clock.
        suggestsReopening:
          type: boolean
          description: >-
            Whether import should offer to put a locally finished task back into an open status,
            because the issue is not done in Jira. The mirror image of suggestsClosing and split the
            same way: this field is the server's decision, reopenTo is what it would lead to, and
            status is the fact both were taken on. Required rather than nullable, because "no
            suggestion" is false rather than absent.
        reopenTo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReopenTarget'
          description: >-
            Which status the reopening would restore, shown so the suggestion says what it will do.
            Null when suggestsReopening is false.

            Note where the analogy with closureReason stops, because it stops at the one place that
            matters: a reason is carried back on the closure row, and this is deliberately not
            carried back on the reopening row — JiraReopeningRow sends the status and lets the server
            map it again. The two are not arbitrary opposites. A reason has to travel because the
            server cannot recompute it: ownership is not visible in the status. This can be
            recomputed, from the status and the user's own lists, and re-deriving it is what keeps the
            suggestion and the import from disagreeing. Mirroring the closure row here would send a
            decision where the server already has the fact.
        excluded:
          type: string
          nullable: true
          example: jira.excludedWaiting
          description: >-
            Why import will skip this row, as an error code the frontend translates.
            Null means it will be imported.
        reconciled:
          type: boolean
          description: >-
            Whether this row came from reconciliation rather than from today's fetch, and the client
            cannot work it out for itself: a reconciled row that suggests a resolved closure is
            byte-identical on the wire to a fetched one.

            It is on the row because two things need it and neither could get it from a count. The
            screen says "showing N of total", where total is what the source reported about the fetch
            alone - so N has to be the rows that are not reconciled, or the line reads "showing 4 of
            3". And the label chain needs to say why a row is there at all, which is a different
            sentence for a row the fetch handed over and a row the app went looking for.
    JiraPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/JiraPreviewRow'
        total:
          type: integer
          format: int32
          description: What Jira reported as the total, so a truncated page is visible.
        reconciliationNotice:
          type: string
          nullable: true
          example: jira.noneRecognized
          description: >-
            Why the reconciliation produced no rows at all, as an error code the frontend translates.
            Null in the ordinary case, where every reconciled key got a row of its own.

            It sits on the response rather than on a row because it answers for the whole set of
            reconciled keys, which no single row can. Two things reach it. jira.noneRecognized means
            more than one key was asked about and Jira recognised none of them, which is what a lost
            project permission looks like when the instance hides an unbrowsable issue behind a 404.
            Any other code means the reconciliation could not be carried out at all - jira.refused for
            an issue the token may not read, jira.unreachable for an instance that did not answer -
            and the field carries it so the fetch's own rows survive a question asked about something
            else. Both readings are the same sentence to the client: the reconciliation has nothing to
            say, and here is why.
    JiraImportRow:
      type: object
      additionalProperties: false
      required: [key, title, status]
      properties:
        key:
          type: string
        title:
          type: string
        note:
          type: string
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        requester:
          type: string
          nullable: true
        status:
          type: string
          description: >-
            The Jira status name. The server decides whether that means waiting, by looking it
            up in the user's waiting list — the client must not send that decision, because the
            setting lives on the server and a required boolean cannot be enforced on the wire.
        waitingSince:
          type: string
          format: date-time
          nullable: true
    JiraClosureRow:
      type: object
      additionalProperties: false
      required: [key, status, reason]
      properties:
        key:
          type: string
        reason:
          allOf:
            - $ref: '#/components/schemas/ClosureReason'
          description: >-
            Why this task is being closed, because the server cannot work it out from the status
            alone — see ClosureReason.

            What `required` buys is a compiler on the sending side: the generated TypeScript makes
            it a mandatory constructor argument, so a client cannot forget it. It buys nothing on the
            receiving side, and that is measured rather than assumed — the generated property is a
            non-nullable enum whose first member is `resolved`, the `[Required]` attribute is inert
            because the host runs no validation pipeline (and could never fail on a non-nullable enum
            anyway), and the hand-written closure validation asks about the key and the status only.
            A body with no `reason` therefore deserialises silently to `resolved`. The server cannot
            tell that case from a genuine resolved closure, so the guarantee has to come from every
            producer setting the field — not from this keyword.
        status:
          type: string
          description: >-
            The Jira status name. Sent for the same reason JiraImportRow sends it: the server decides
            whether that means done by looking it up in the user's done list, and takes the decision
            again rather than trusting a client that may have previewed under an older setting.
        doneAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            What the local task's completion time becomes. A fact the client saw, carried the same way
            waitingSince is — the import deliberately does not call Jira, so it cannot look this up.
    JiraReopeningRow:
      type: object
      additionalProperties: false
      required: [key, status]
      properties:
        key:
          type: string
        status:
          type: string
          description: >-
            The Jira status name. Carried for the same reason JiraClosureRow carries it: the server
            maps it to a status again rather than letting the client name the one it wants, so the
            suggestion and the import cannot disagree.
        waitingSince:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the issue reached its current status, used when that status maps to waiting. The
            same fact waitingSince carries on an import row, sent the same way and for the same
            reason: the import deliberately does not call Jira, so it cannot look this up.
    JiraImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/JiraImportRow'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/JiraClosureRow'
          description: >-
            Tasks already imported whose issue is now done, to be closed locally. Optional rather than
            required, so a client that only imports sends what it always sent.
        reopenings:
          type: array
          items:
            $ref: '#/components/schemas/JiraReopeningRow'
          description: >-
            Tasks finished locally whose issue is not done in Jira, to be put back into an open
            status. Its own list rather than a flag on closures, because the two do opposite things
            to the same field and a single list would need a discriminator to tell them apart.
            Optional for the same reason closures is.
    JiraImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped, closed, reopened]
      properties:
        imported:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        closed:
          type: integer
          format: int32
          description: How many local tasks were closed because their issue is done.
        reopened:
          type: integer
          format: int32
          description: >-
            How many local tasks were put back into an open status. Its own count rather than folded
            into imported, because once the reopening lands the button will do three things and one
            number cannot say which of them happened.
    AdoConnectionResponse:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
    AdoStatesResponse:
      type: object
      additionalProperties: false
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    AdoPreviewRow:
      type: object
      additionalProperties: false
      required:
        [key, title, url, isWaiting, alreadyImported, suggestsClosing, suggestsReopening, reconciled]
      properties:
        key:
          type: string
        title:
          type: string
        url:
          type: string
          description: >-
            Where Azure DevOps shows this work item. Built by the app rather than taken from the
            server, whose own URLs address the project by GUID and are not humanly navigable.
            Always present: a preview cannot happen without a configured collection, so this is
            required rather than nullable — a nullable field would add an @if branch, and a
            branch is unmeasured until a fixture renders it.
        note:
          type: string
          nullable: true
          description: >-
            The work item description, converted to CommonMark. Which field it comes from depends
            on the work item type: a Bug carries Microsoft.VSTS.TCM.ReproSteps, a User Story
            System.Description. Nullable because a type may carry neither.
        deadline:
          type: string
          format: date
          nullable: true
          description: >-
            The deadline the import would set, derived by the server from today plus
            adoDefaultDeadlineDays. Azure DevOps has no due date field of its own, so the app
            proposes one. Nullable because adoDefaultDeadlineDays 0 means no deadline. The client
            shows this value; it does not send it back, and the import derives it again.
        requester:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
          description: >-
            The work item state, shown so the user can see why a row is waiting. Nullable because a
            reconciled key the source does not know has no state - no answer came back to take one
            from. Forcing an empty string would be the worse of the two forms: a field whose type
            says "always there" while its value says otherwise. The row explains the absence itself,
            through its excluded code.
        workItemType:
          type: string
          nullable: true
          description: >-
            The work item type, shown because state names differ per type and because the type
            decides whether the row passes the adoWorkItemTypes filter. Nullable for the same reason
            state is, and nullable together with it rather than one of the two being forced empty:
            both are filled from the same answer and are absent together, so giving them different
            forms would leave a reader unable to tell which form was the deliberate one.
        isWaiting:
          type: boolean
          description: Whether the state is in the user's waiting list.
        waitingSince:
          type: string
          format: date-time
          nullable: true
          description: >-
            Microsoft.VSTS.Common.StateChangeDate, which arrives with the work item itself — no
            second call per row, unlike Jira, whose equivalent required the changelog.
        alreadyImported:
          type: boolean
        suggestsClosing:
          type: boolean
          description: >-
            Whether import should offer to close the local task. See the field of the same name on
            JiraPreviewRow: the server's decision, taken on three facts, and taken again on import.
        closureReason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClosureReason'
          description: >-
            Which of the two findings the closing suggestion rests on. See the field of the same name
            on JiraPreviewRow. Null when suggestsClosing is false.
        doneAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Microsoft.VSTS.Common.StateChangeDate for a row that suggests closing. Its own field
            rather than a loosened waitingSince, which the preview nulls for every row that is not
            waiting — and a finished row never is. Null as well for an unassigned closure: the work
            item was never finished, it stopped being yours, so the completion time falls back to the
            clock.
        suggestsReopening:
          type: boolean
          description: >-
            Whether import should offer to put a locally finished task back into an open status. See
            the field of the same name on JiraPreviewRow: the server's decision, with reopenTo as
            what it would lead to and state as the fact both were taken on.
        reopenTo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReopenTarget'
          description: >-
            Which status the reopening would restore, shown so the suggestion says what it will do.
            Null when suggestsReopening is false. See the field of the same name on JiraPreviewRow for
            where the analogy with closureReason stops: this one is not carried back on the reopening
            row, because the server can re-derive it and a reason it cannot.
        excluded:
          type: string
          nullable: true
          example: ado.excludedWaiting
          description: >-
            Why import will skip this row, as an error code the frontend translates.
            Null means it will be imported.
        reconciled:
          type: boolean
          description: >-
            Whether this row came from reconciliation rather than from today's fetch. See the field of
            the same name on JiraPreviewRow: the client cannot derive it, the "showing N of total"
            line needs it because total counts the fetch alone, and the label chain needs it to say
            why the row is there.
    AdoPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AdoPreviewRow'
        total:
          type: integer
          format: int32
          description: What Azure DevOps reported as the total, so a truncated page is visible.
        reconciliationNotice:
          type: string
          nullable: true
          example: ado.noneRecognized
          description: >-
            Why the reconciliation produced no rows at all, as an error code the frontend translates.
            Null in the ordinary case, where every reconciled key got a row of its own. See the field
            of the same name on JiraPreviewResponse: ado.noneRecognized means more than one key was
            asked about and none was recognised, and any other code means the reconciliation could not
            be carried out at all - ado.refused, ado.unreachable - with the fetch's own rows kept
            either way.
    AdoImportRow:
      type: object
      additionalProperties: false
      required: [key, title, state, workItemType]
      properties:
        key:
          type: string
        title:
          type: string
        note:
          type: string
          nullable: true
        requester:
          type: string
          nullable: true
        state:
          type: string
          description: >-
            The work item state. The server decides whether that means waiting, by looking it
            up in the user's waiting list — the client must not send that decision, because the
            setting lives on the server and a required boolean cannot be enforced on the wire.
            The row carries no deadline either, for the same reason: the deadline is derived
            from the clock and adoDefaultDeadlineDays. The fact can be sent; the decision cannot.
        workItemType:
          type: string
          description: >-
            The work item type, so the server can apply the adoWorkItemTypes filter again
            rather than trusting that the client did.
        waitingSince:
          type: string
          format: date-time
          nullable: true
    AdoClosureRow:
      type: object
      additionalProperties: false
      required: [key, state, reason]
      properties:
        key:
          type: string
        reason:
          allOf:
            - $ref: '#/components/schemas/ClosureReason'
          description: >-
            Why this task is being closed. See the field of the same name on JiraClosureRow, and
            ClosureReason for why the state alone cannot answer it.
        state:
          type: string
          description: >-
            The work item state. Sent for the same reason AdoImportRow sends it: the server looks it
            up in the user's done list and takes the decision again rather than trusting the client.
        doneAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            What the local task's completion time becomes, carried the same way waitingSince is. The
            import deliberately does not call Azure DevOps, so it cannot look this up.
    AdoReopeningRow:
      type: object
      additionalProperties: false
      required: [key, state]
      properties:
        key:
          type: string
        state:
          type: string
          description: >-
            The work item state. Carried for the same reason AdoClosureRow carries it: the server
            maps it to a status again rather than letting the client name the one it wants, so the
            suggestion and the import cannot disagree.
        waitingSince:
          type: string
          format: date-time
          nullable: true
          description: >-
            Microsoft.VSTS.Common.StateChangeDate, used when the state maps to waiting. The same
            fact waitingSince carries on an import row, sent the same way and for the same reason:
            the import deliberately does not call Azure DevOps, so it cannot look this up.
    AdoImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AdoImportRow'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/AdoClosureRow'
          description: >-
            Tasks already imported whose work item is now done, to be closed locally. Optional rather
            than required, so a client that only imports sends what it always sent.
        reopenings:
          type: array
          items:
            $ref: '#/components/schemas/AdoReopeningRow'
          description: >-
            Tasks finished locally whose work item is not done in Azure DevOps, to be put back into
            an open status. See the field of the same name on JiraImportRequest for why it is its own
            list rather than a flag on closures.
    AdoImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped, closed, reopened]
      properties:
        imported:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        closed:
          type: integer
          format: int32
          description: How many local tasks were closed because their work item is done.
        reopened:
          type: integer
          format: int32
          description: >-
            How many local tasks were put back into an open status. See the field of the same name on
            JiraImportResponse.
    SettingsRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          nullable: true
          example: da
        delegates:
          type: array
          items:
            type: string
          description: >-
            People you hand tasks to, offered as suggestions when a task moves to WaitingFor. A
            suggestion list, not a closed set: the who field stays free text, because waiting on
            somebody unlisted — or on nobody at all — are both valid states.
        jiraBaseUrl:
          type: string
          nullable: true
        jiraProjectKey:
          type: string
          nullable: true
        jiraWaitingStatuses:
          type: array
          items:
            type: string
        jiraIncludeWaiting:
          type: boolean
        jiraDoneStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean the issue is finished. No switch beside it, unlike the waiting and duty
            pairs: doneness only ever offers to close a task you already have, so there is nothing to
            opt into. An empty list is valid and means no suggestions.
        jiraDutyStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean "waiting for the shared duty pool". Issues in these are fetched
            regardless of assignee when jiraOnDuty is on, and they arrive actionable rather than
            waiting.
        jiraOnDuty:
          type: boolean
          description: >-
            Whether the user currently holds the 2nd level support duty. Off by default. Separate
            from the list so the list survives going off duty.
        adoBaseUrl:
          type: string
          nullable: true
          description: The Azure DevOps collection URL, which may contain a space in its name.
        adoProject:
          type: string
          nullable: true
        adoDoneStates:
          type: array
          items:
            type: string
          description: >-
            States that mean the work item is finished. The counterpart of jiraDoneStatuses, and its
            own list rather than a shared one: the two systems spell different words.
        adoWaitingStates:
          type: array
          items:
            type: string
          description: >-
            States that mean "waiting for somebody else". Compared ordinally: two states that
            differ only in case are two states the system keeps apart.
        adoIncludeWaiting:
          type: boolean
          description: Whether rows in a waiting state are imported anyway. Off by default.
        adoWorkItemTypes:
          type: array
          items:
            type: string
          description: >-
            The work item types to import, so test artefacts stay out. A requirement rather than
            an optional filter: an empty list is rejected with ado.workItemTypesRequired, and an
            absent one restores the default Bug, User Story, Task. The plan said an empty list
            meant every type; that was wrong twice over. It is the same trap as the empty project
            key — the absence of a limit is not a neutral default — and the storage cannot carry
            the claim anyway, because an empty list is stored as no row at all and the reader
            cannot tell never-configured from deliberately-emptied. Compared ordinally, like
            adoWaitingStates.
        adoDefaultDeadlineDays:
          type: integer
          format: int32
          default: 3
          description: >-
            How many days ahead the import sets a deadline, because Azure DevOps has no due date
            field of its own. 0 means no deadline. Not nullable: a nullable field would add an
            @if branch in the frontend, and 0 reads as "off" for a number of days. Rejected
            below 0 or above 365 with ado.defaultDeadlineDaysInvalid.

            The default is load-bearing here and only here. This is a full replacement, so an
            absent field means clear — but System.Text.Json gives 0 for an absent int, and 0 is
            a meaningful value, so without the default a request that never mentioned this field
            would silently turn the deadline off. NSwag turns the default into a property
            initializer, which the deserialiser leaves alone for an absent field, so absent binds
            to 3 and a deliberate 0 stays 0. SettingsResponse deliberately carries no default:
            an initializer there would let a handler that never assigned the field answer 3 and
            make the test for it unfailable.
        reviewWeekday:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          default: 5
          description: >-
            The weekday the weekly review is suggested on, 0 = Sunday. 5 is Friday, which is
            Allen's own recommendation. Rejected outside 0-6 with review.weekdayInvalid.

            The default is load-bearing for the same reason adoDefaultDeadlineDays' is, and the
            trap here is sharper. This is a full replacement, System.Text.Json gives 0 for an
            absent int, and 0 is Sunday — a real weekday rather than a missing value. So without
            the default, a save that never mentioned the review would move the habit to Sunday.
            NSwag turns the default into a property initializer, which the deserialiser leaves
            alone for an absent field, so absent binds to Friday and a deliberate Sunday stays
            Sunday.

            SettingsResponse deliberately carries no default, the same as adoDefaultDeadlineDays:
            an initializer there would let a handler that never assigned the field answer 5 and
            make the test for it unfailable.
        reviewTimeOfDay:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          default: '15:00'
          description: >-
            The time of day the review is suggested at, HH:mm in the machine's own zone. Rejected
            with review.timeOfDayInvalid if it will not parse.

            Local rather than UTC on purpose: "Friday at three" is a statement about the user's
            own afternoon, and the review's stored completion timestamp is the UTC half of the
            comparison. ReviewSchedule.For does the conversion in one frame; see IClock.LocalNow
            for why the local reading is its own thing rather than derived.
    SettingsResponse:
      type: object
      additionalProperties: false
      required:
        - delegates
        - jiraWaitingStatuses
        - jiraIncludeWaiting
        - jiraDutyStatuses
        - jiraOnDuty
        - jiraDoneStatuses
        - hasJiraToken
        - adoWaitingStates
        - adoDoneStates
        - adoIncludeWaiting
        - adoWorkItemTypes
        - adoDefaultDeadlineDays
        - hasAdoToken
        - reviewWeekday
        - reviewTimeOfDay
      properties:
        language:
          type: string
          nullable: true
          example: da
        delegates:
          type: array
          items:
            type: string
          description: >-
            People you hand tasks to, offered as suggestions when a task moves to WaitingFor. A
            suggestion list, not a closed set: the who field stays free text, because waiting on
            somebody unlisted — or on nobody at all — are both valid states.
        jiraBaseUrl:
          type: string
          nullable: true
        jiraProjectKey:
          type: string
          nullable: true
        jiraWaitingStatuses:
          type: array
          items:
            type: string
        jiraIncludeWaiting:
          type: boolean
        jiraDoneStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean the issue is finished. No switch beside it, unlike the waiting and duty
            pairs: doneness only ever offers to close a task you already have, so there is nothing to
            opt into. An empty list is valid and means no suggestions.
        jiraDutyStatuses:
          type: array
          items:
            type: string
          description: >-
            Statuses that mean "waiting for the shared duty pool". Issues in these are fetched
            regardless of assignee when jiraOnDuty is on, and they arrive actionable rather than
            waiting.
        jiraOnDuty:
          type: boolean
          description: >-
            Whether the user currently holds the 2nd level support duty. Off by default. Separate
            from the list so the list survives going off duty.
        hasJiraToken:
          type: boolean
          description: >-
            Whether a token is stored. The token itself is never returned; it is written
            through PUT /api/settings/jira-token and cleared through DELETE.
        adoBaseUrl:
          type: string
          nullable: true
          description: The Azure DevOps collection URL, which may contain a space in its name.
        adoProject:
          type: string
          nullable: true
        adoDoneStates:
          type: array
          items:
            type: string
          description: >-
            States that mean the work item is finished. The counterpart of jiraDoneStatuses, and its
            own list rather than a shared one: the two systems spell different words.
        adoWaitingStates:
          type: array
          items:
            type: string
          description: >-
            States that mean "waiting for somebody else". Compared ordinally: two states that
            differ only in case are two states the system keeps apart.
        adoIncludeWaiting:
          type: boolean
          description: Whether rows in a waiting state are imported anyway. Off by default.
        adoWorkItemTypes:
          type: array
          items:
            type: string
          description: >-
            The work item types to import, so test artefacts stay out. Never empty: an absent row
            reads back as the default Bug, User Story, Task, and PUT /api/settings rejects an
            empty list rather than storing one. See the request schema for why.
        adoDefaultDeadlineDays:
          type: integer
          format: int32
          description: >-
            How many days ahead the import sets a deadline, because Azure DevOps has no due date
            field of its own. 0 means no deadline. Always the effective value: an absent row
            reads back as 3. No default is declared here on purpose — see the request schema.
        hasAdoToken:
          type: boolean
          description: >-
            Whether a token is stored. The token itself is never returned; it is written
            through PUT /api/settings/ado-token and cleared through DELETE.
        reviewWeekday:
          type: integer
          format: int32
          description: >-
            The weekday the weekly review is suggested on, 0 = Sunday. Always the effective
            value: an absent row reads back as 5. No default is declared here on purpose — see
            the request schema.
        reviewTimeOfDay:
          type: string
          description: >-
            The time of day the review is suggested at, HH:mm local. Always the effective value:
            an absent row reads back as 15:00.
    ReviewStatusResponse:
      type: object
      additionalProperties: false
      required:
        - due
        - nextDueAt
      properties:
        due:
          type: boolean
          description: >-
            Whether a review is owed right now. Computed from the chosen weekday and time, the
            stored completion timestamp and the clock — never stored, and nothing runs at
            midnight to keep it true. The same rule as DeadlineBucket.deferred: the app has no
            tray and no background sync, so a moment that fired at 15:00 would hit nothing with
            the window shut. This survives the app having been closed for three weeks.
        lastCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the review was last finished, UTC. Null means it never has been, which reads as
            owed rather than as not-configured: a fresh database says so on day one, and one
            press clears it.

            Deliberately absent from SettingsResponse and never written by PUT /api/settings.
            That route is a full replacement which reads an absent field as clear, so a field
            there would be wiped by any unrelated save — the same reason each token has a route
            of its own. It is written by POST /api/review/complete and nowhere else.
        nextDueAt:
          type: string
          format: date-time
          description: >-
            The next scheduled moment, UTC. Carried so the client does no arithmetic, and so a
            test can assert about the boundary rather than only about which side of it we are on.
    JiraTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    AdoTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    TagRef:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
          description: >-
            The colour's slot: the rainbow's seven, then each again in two more shades. Given by the
            server when the tag is created, the first free slot (the tag-chips design).
    TagListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    UpdateTagRequest:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: integer, format: int32, minimum: 0, maximum: 20 }
    SetTaskTagsRequest:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        tagIds:
          type: array
          items: { type: integer, format: int64 }
    AiTagSuggestions:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        tagIds:
          type: array
          items: { type: integer, format: int64 }
    AiStatusResponse:
      type: object
      additionalProperties: false
      required: [ready, searchReady]
      properties:
        ready: { type: boolean }
        searchReady:
          type: boolean
          description: >-
            Whether the embedding model is there too, which search by meaning and duplicate
            warnings need. Asked apart, because the two models are installed apart.
    AiRetroActionsRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AiRetroNote'
    AiRetroNote:
      type: object
      additionalProperties: false
      required: [key, text]
      properties:
        key: { type: string }
        text: { type: string }
        owner: { type: string, nullable: true }
    AiRetroActionsResponse:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AiRetroAction'
    AiRetroAction:
      type: object
      additionalProperties: false
      required: [key, title, ownerIsMine]
      properties:
        key: { type: string }
        title: { type: string }
        owner:
          type: string
          nullable: true
          description: A guessed owner, only for a note whose board names none.
        ownerIsMine:
          type: boolean
          description: Whether the guessed owner is one of the user's aliases.
    AiSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string }
    AiSearchResponse:
      type: object
      additionalProperties: false
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/AiSearchHit'
    AiSearchHit:
      type: object
      additionalProperties: false
      required: [id, title, status]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { $ref: '#/components/schemas/TodoStatus' }
        externalUrl: { type: string, nullable: true }
    AiDuplicatesRequest:
      type: object
      additionalProperties: false
      required: [sourceId, rows]
      properties:
        sourceId: { type: string }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AiDuplicateCandidate'
    AiDuplicateCandidate:
      type: object
