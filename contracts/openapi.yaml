openapi: 3.0.4
info:
  title: Todo API
  version: 1.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Reports that the API is running.
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/tasks:
    get:
      operationId: listTasks
      tags:
        - Tasks
      parameters:
        - name: includeCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The tasks, ordered by deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTaskListResponse'
    post:
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoTaskRequest'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
  /api/tasks/{id}:
    put:
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '400':
          description: The request is not valid.
        '404':
          description: No task with that id.
    delete:
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The task is gone.
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks:
    post:
      operationId: createSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubTaskRequest'
      responses:
        '201':
          description: The created subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
        '404':
          description: No task with that id.
  /api/tasks/{id}/subtasks/{subTaskId}:
    put:
      operationId: updateSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subTaskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubTaskRequest'
      responses:
        '200':
          description: The updated subtask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubTask'
        '400':
          description: The request is not valid.
        '404':
          description: No such task or subtask.
    delete:
      operationId: deleteSubTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subTaskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The subtask is gone.
        '404':
          description: No such task or subtask.
  /api/retro/preview:
    post:
      operationId: previewRetro
      tags:
        - Retro
      summary: Reads a retro board export without storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroPreviewRequest'
      responses:
        '200':
          description: The rows the export contains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroPreviewResponse'
        '400':
          description: The export could not be read.
  /api/retro/import:
    post:
      operationId: importRetro
      tags:
        - Retro
      summary: Creates a task for every row that is not imported already.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroImportRequest'
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroImportResponse'
        '400':
          description: The request is not valid.
  /api/retro/aliases:
    get:
      operationId: listRetroAliases
      tags:
        - Retro
      responses:
        '200':
          description: The names counted as the user's own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
    put:
      operationId: replaceRetroAliases
      tags:
        - Retro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetroAliasesRequest'
      responses:
        '200':
          description: The stored names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroAliasesResponse'
        '400':
          description: The request is not valid.
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0.0
    TodoStatus:
      type: string
      enum: [open, inProgress, done]
    DeadlineBucket:
      type: string
      enum: [overdue, today, thisWeek, later, noDeadline]
    TodoSubTask:
      type: object
      additionalProperties: false
      required: [id, title, isDone]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        isDone: { type: boolean }
    TodoTask:
      type: object
      additionalProperties: false
      required: [id, sourceId, title, status, bucket, createdAt, subTasks]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string }
        title: { type: string }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        requester: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        bucket: { $ref: '#/components/schemas/DeadlineBucket' }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        subTasks:
          type: array
          items:
            $ref: '#/components/schemas/TodoSubTask'
    TodoTaskListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoTask'
    CreateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        requester: { type: string, nullable: true }
    UpdateTodoTaskRequest:
      type: object
      additionalProperties: false
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        requester: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
    CreateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
    UpdateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title, isDone]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        isDone: { type: boolean }
    RetroPreviewRequest:
      type: object
      additionalProperties: false
      required: [csv]
      properties:
        csv: { type: string }
    RetroPreviewRow:
      type: object
      additionalProperties: false
      required: [key, title, zone, isMine, alreadyImported]
      properties:
        key: { type: string }
        title: { type: string }
        owner: { type: string, nullable: true }
        author: { type: string, nullable: true }
        zone: { type: string }
        deadline: { type: string, format: date, nullable: true }
        isMine: { type: boolean }
        alreadyImported: { type: boolean }
    RetroPreviewResponse:
      type: object
      additionalProperties: false
      required: [rows, skippedRatingCards]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroPreviewRow'
        skippedRatingCards: { type: integer }
    RetroImportRow:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        requester: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
    RetroImportRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetroImportRow'
    RetroImportResponse:
      type: object
      additionalProperties: false
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    RetroAliasesRequest:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
    RetroAliasesResponse:
      type: object
      additionalProperties: false
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
